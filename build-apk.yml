name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install project dependencies
        run: bun install

      # Vite creates the web assets that Capacitor embeds inside the APK.
      # This is an internal packaging step; the final downloadable artifact is an APK.
      - name: Prepare app assets for Android
        run: bun run build

      - name: Verify Capacitor configuration
        run: |
          test -f capacitor.config.ts -o -f capacitor.config.json || {
            echo "ERROR: Capacitor config is missing."
            exit 1
          }
          test -d dist || {
            echo "ERROR: dist/ was not created by the app build."
            exit 1
          }

      - name: Add Android platform if needed
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi

      - name: Sync assets into Android project
        run: bunx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK was created
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK file
        uses: actions/upload-artifact@v4
        with:
          name: Deen-Core-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
